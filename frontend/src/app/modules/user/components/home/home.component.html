<div class="drive">

    <div class="drive__header">
        <div class="drive__breadcrumb">
            <button *ngIf="currentFolder" type="button" (click)="goBack()" class="back-btn">
                <img src="/icons/back.svg" alt="Back" class="back-icon" />
                <!-- Back -->
            </button>
            <div class="drive__title-row">
                <span class="drive__folder-title">{{ currentFolder ? currentFolder.name : 'Home' }}</span>
                <app-file-action-dropdown
                    variant="headerDropdown"
                    [headerContext]="currentFolder"
                    (action)="onAction($event)"
                />
            </div>
        </div>

        <div class="drive__filters">
            <button type="button" class="chip">Date</button>
            <button type="button" class="chip">Size</button>
        </div>
    </div>

    <div class="drive__loading" *ngIf="loading">Loading files...</div>

    <div class="drive__section" *ngIf="folders.length > 0">
        <div class="drive__section-title">Folders</div>

        <div class="drive__grid drive__grid--folders">
            <div class="folder-card" *ngFor="let folder of folders" (click)="onFolderClick(folder)">
                <div class="folder-card__left">
                    <span class="folder-card__emoji" aria-hidden="true">📁</span>
                    <span class="folder-card__name-text">{{ folder.name }}</span>
                </div>
                <div class="folder-card__actions" (click)="$event.stopPropagation()">
                    <app-file-action-dropdown
                        variant="itemDropdown"
                        [item]="folder"
                        [activeItemMenuKey]="openItemMenuKey"
                        (itemMenuOpenChange)="onItemMenuKeyChange($event)"
                        (action)="onAction($event)"
                    />
                </div>
            </div>
        </div>
    </div>

    <div class="drive__section" *ngIf="files.length > 0">
        <div class="drive__section-title">Files</div>

        <div class="drive__grid drive__grid--files">
            <div class="file-card" *ngFor="let file of files">
                <div class="file-card__top">
                    <div class="file-card__text">
                        <div class="file-card__name">{{ file.name }}</div>
                        <div class="file-card__meta">{{ formatFileSize(file.size) }}</div>
                    </div>
                    <div class="file-card__actions" (click)="$event.stopPropagation()">
                        <app-file-action-dropdown
                            variant="itemDropdown"
                            [item]="file"
                            [activeItemMenuKey]="openItemMenuKey"
                            (itemMenuOpenChange)="onItemMenuKeyChange($event)"
                            (action)="onAction($event)"
                        />
                    </div>
                </div>
                <div class="file-card__preview"></div>
            </div>
        </div>
    </div>


    <div class="drive__empty" *ngIf="!loading && files.length === 0 && folders.length === 0">
        <p>No files or folders yet. Use <strong>New</strong> in the sidebar to add files or folders.</p>
    </div>

</div>
