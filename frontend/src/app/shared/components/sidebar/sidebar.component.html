<aside class="sidebar" [class.sidebar--collapsed]="collapsed" id="app-sidebar"
       (dragenter)="onDragEnter($event)"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)"
       [class.drop-active]="dragActive"
>
  <!-- <div class="sidebar-fixed-top">
    <button class="logout-btn logout-btn--top" id="sidebar-logout" title="Logout" (click)="onLogout()">
      <img src="/icons/logout.svg" alt="logout" class="icon" />
      <span class="sidebar-label">Logout</span>
    </button>
  </div> -->

  <div class="sidebar-content">
    <div class="sidebar-new">
      <app-file-action-dropdown variant="sidebar" (action)="onAction($event)"></app-file-action-dropdown>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <ul class="sidebar-list">
      <li class="sidebar-item" [class.sidebar-item--active]="activeItem === 'files'" (click)="setActive('files')"
        id="sidebar-my-files">
        <a class="sidebar-link" title="My Files">
          <img src="/icons/folder.svg" alt="files" class="icon" />
          <span class="sidebar-label">My Files</span>
        </a>
      </li>

      <li class="sidebar-item" [class.sidebar-item--active]="activeItem === 'trash'" (click)="setActive('trash')"
        id="sidebar-trash">
        <a class="sidebar-link" title="Trash">
          <img src="/icons/trash.svg" alt="trash" class="icon" />
          <span class="sidebar-label">Trash</span>
        </a>
      </li>

      <li class="sidebar-item" [class.sidebar-item--active]="activeItem === 'shared'" (click)="setActive('shared')"
        id="sidebar-shared">
        <a class="sidebar-link" title="Shared With Me">
          <img src="/icons/share.svg" alt="shared" class="icon" />
          <span class="sidebar-label">Shared With Me</span>
        </a>
      </li>

      <!-- <li class="sidebar-item" [class.sidebar-item--active]="activeItem === 'trash'" (click)="setActive('trash')"
        id="sidebar-trash">
        <a class="sidebar-link" title="Trash" routerLink="/trash">
          <img src="/icons/trash.svg" alt="trash" class="icon" />
          <span class="sidebar-label">Trash</span>
        </a>
      </li> -->

      <li class="sidebar-item sidebar-item--storage" id="sidebar-storage">
        <div class="sidebar-link sidebar-link--static" title="Used Storage">
          <img src="/icons/cloud.svg" alt="storage" class="icon" />
          <div class="storage-info">
            <span class="sidebar-label">Used Storage</span>
            <span class="storage-text">
              {{ storageUsed | size }} of {{ storageLimit | size }} used
            </span>

            <!-- Progress Bar -->
            <div class="progress-track">
              <div class="progress-fill" [style.width.%]="storageLimit ? (storageUsed / storageLimit) * 100 : 0">
              </div>
            </div>
            <!--             
            <span class="storage-percent">{{ storageUsed }}% used</span>
            <div class="progress-track">
              <div class="progress-fill" [style.width.%]="storageUsed"></div>
            </div> -->
          </div>
        </div>
      </li>
    </ul>
  </nav>
  </div>
</aside>

<app-upload-helper
  #uploadHelper
  (fileUploadSuccess)="onUploadSuccess($event)"
  (folderUploadCompleted)="onFolderUploadCompleted($event)"
></app-upload-helper>

<!-- Folder upload status bar with Cancel button (shown during folder upload) -->
<div class="sidebar-upload-bar" *ngIf="uploadHelper.folderUploadLoading">
  <span class="sidebar-upload-bar__text">{{ uploadHelper.folderUploadStatus || 'Uploading...' }}</span>
  <button type="button" class="sidebar-upload-bar__cancel" (click)="uploadHelper.cancelFolderUpload()">
    Cancel
  </button>
</div>

<div class="sidebar-overlay" *ngIf="!collapsed && isMobile" (click)="onOverlayClick()" id="sidebar-overlay">
</div>
