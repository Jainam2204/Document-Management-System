<aside class="sidebar" [class.sidebar--collapsed]="collapsed" id="app-sidebar">
  <nav class="sidebar__nav">
    <ul class="sidebar__list">
      <li class="sidebar__item"
          [class.sidebar__item--active]="activeItem === 'files'"
          (click)="setActive('files')"
          id="sidebar-my-files">
        <a class="sidebar__link" title="My Files">
          <svg class="sidebar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="sidebar__label">My Files</span>
        </a>
      </li>

      <li class="sidebar__item"
          [class.sidebar__item--active]="activeItem === 'trash'"
          (click)="setActive('trash')"
          id="sidebar-trash">
        <a class="sidebar__link" title="Trash">
          <svg class="sidebar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
          <span class="sidebar__label">Trash</span>
        </a>
      </li>

      <li class="sidebar__item sidebar__item--storage" id="sidebar-storage">
        <div class="sidebar__link" title="Used Storage">
          <svg class="sidebar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
          </svg>
          <div class="sidebar__storage-info">
            <span class="sidebar__label">Used Storage</span>
            <span class="sidebar__storage-percent">{{ storageUsed }}% used</span>
            <div class="sidebar__progress-track">
              <div class="sidebar__progress-fill" [style.width.%]="storageUsed"></div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </nav>

  <div class="sidebar__footer">
    <button class="sidebar__logout-btn" id="sidebar-logout" title="Logout" (click)="onLogout()">
      <svg class="sidebar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="sidebar__label">Logout</span>
    </button>
  </div>
</aside>

<div class="sidebar__overlay"
     *ngIf="!collapsed && isMobile"
     (click)="onOverlayClick()"
     id="sidebar-overlay">
</div>
